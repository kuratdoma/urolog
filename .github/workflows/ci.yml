name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için yeni push geldiğinde eski çalışmayı iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # backend/Dockerfile ile aynı
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Bağımlılıkları kur
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Testler
        working-directory: backend
        # Her iki test kökü birlikte çalışır: paylaşılan uygulama durumu
        # (rate limit sayaçları, dependency override'ları) yüzünden ayrı ayrı
        # geçip birlikte düşen testleri yakalamak için — bkz. backend/conftest.py.
        run: pytest tests/ app/tests/ -q

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Aşağıdaki lint adımı base ile diff alıyor; sığ klonda base ref olmaz.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: frontend
        run: npm ci

      - name: Tip kontrolü
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Testler
        working-directory: frontend
        run: npm run test -- --run

      # NOT: `npm run lint` bilinçli olarak zorunlu tutulmuyor. Depoda ~440
      # birikmiş ESLint hatası var; hepsini bir anda temizlemek bu PR'ın konusu
      # değil. Aşağıdaki adım yalnızca DEĞİŞEN dosyalarda yeni hata girmesini
      # engeller — birikmiş borç ayrı ayıklanır, yeni borç eklenmez.
      - name: Lint (yalnızca değişen dosyalar)
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: |
          files=$(git diff --name-only --diff-filter=ACMR \
                    ${{ github.event.pull_request.base.sha }}...HEAD \
                    -- '*.ts' '*.tsx' | sed 's|^frontend/||')
          if [ -z "$files" ]; then
            echo "Değişen TS/TSX dosyası yok."; exit 0
          fi
          echo "$files" | xargs npx eslint
