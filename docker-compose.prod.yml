services:
  db:
    image: postgres:15-alpine
    restart: always
    container_name: ${PROJECT_NAME}_db
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
      -c archive_mode=on
      -c archive_command='mkdir -p /var/lib/postgresql/data/archive && test ! -f /var/lib/postgresql/data/archive/%f && cp %p /var/lib/postgresql/data/archive/%f'
    environment:
      POSTGRES_USER: ${DB_USER:-emr_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env — no insecure default allowed in production}
      POSTGRES_DB: ${DB_NAME:-${PROJECT_NAME}_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-emr_admin} -d ${DB_NAME:-${PROJECT_NAME}_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${DB_PORT_EXTERNAL}:5432"
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  backend:
    container_name: ${PROJECT_NAME}_backend
    image: ${PROJECT_NAME}-backend:${GIT_SHA:-latest}
    build:
      context: ./backend
    restart: always
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 300 --access-logfile - --error-logfile -
    # Dinamik env dosyası kullanımı için PROJECT_NAME_FILE değişkenini kullanıyoruz
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - GIT_SHA=${GIT_SHA:-latest}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/static:/app/static
      - ./.git:/app/.git
      - ./scripts:/app/scripts
      - ./.env:/app/.env:ro
      - ${SSH_AUTH_DIR:-/home/alp/.ssh}:/app/.ssh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${BACKEND_PORT_EXTERNAL}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT_EXTERNAL}:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    container_name: ${PROJECT_NAME}_frontend
    image: ${PROJECT_NAME}-frontend:${GIT_SHA:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA}
        NEXT_PUBLIC_API_URL: /api
    restart: always
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT_EXTERNAL:-3005}:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl_managed:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  db_data:
    external: true
    name: ${DB_VOLUME_NAME:-urolog_db_data}
